name: Synthetic tests and public safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, qwen/batch-2-mock-server]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
# No AI/model API, external secrets, build deployment, or scheduled workflow.
